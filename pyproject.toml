[project]
name = "AeroPulse"
version = "0.1.0"
description = "Backend for drone fleet management and telemetry collection, processing, and visualization."
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn", "pydantic-settings", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3,<4", "alembic>=1.16,<2"]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest", "httpx2", "ruff", "mypy", "pre-commit>=4.4"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]